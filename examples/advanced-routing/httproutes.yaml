apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: path-based-routing
  namespace: advanced-routing-test
spec:
  parentRefs:
  - name: advanced-gateway
    namespace: advanced-routing-test
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1
    backendRefs:
    - name: service-v1
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /v2
    backendRefs:
    - name: service-v2
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: header-based-routing
  namespace: advanced-routing-test
spec:
  parentRefs:
  - name: advanced-gateway
    namespace: advanced-routing-test
  rules:
  - matches:
    - headers:
      - name: version
        value: v1
    backendRefs:
    - name: service-v1
      port: 8080
  - matches:
    - headers:
      - name: version
        value: v2
    backendRefs:
    - name: service-v2
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weighted-routing
  namespace: advanced-routing-test
spec:
  parentRefs:
  - name: advanced-gateway
    namespace: advanced-routing-test
  hostnames:
  - "canary.example.com"
  rules:
  - backendRefs:
    - name: service-v1
      port: 8080
      weight: 80
    - name: service-v2
      port: 8080
      weight: 20


