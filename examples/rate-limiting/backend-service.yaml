apiVersion: v1
kind: Service
metadata:
  name: rate-limited-app
  namespace: rate-limiting-test
spec:
  selector:
    app: rate-limited-app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limited-app
  namespace: rate-limiting-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rate-limited-app
  template:
    metadata:
      labels:
        app: rate-limited-app
    spec:
      nodeSelector:
        role: service
      containers:
      - name: app
        image: hashicorp/http-echo:latest
        args:
        - "-text=Rate Limited Service - Request accepted!"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"


