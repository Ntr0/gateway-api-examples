apiVersion: v1
kind: Service
metadata:
  name: example-app
  namespace: gateway-api-test
spec:
  selector:
    app: example-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app
  namespace: gateway-api-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: example-app
  template:
    metadata:
      labels:
        app: example-app
    spec:
      nodeSelector:
        role: service
      containers:
      - name: app
        image: hashicorp/http-echo:latest
        args:
        - "-text=Hello from Gateway API!"
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
