apiVersion: v1
kind: Service
metadata:
  name: service-v1
  namespace: advanced-routing-test
spec:
  selector:
    app: service-v1
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-v1
  namespace: advanced-routing-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-v1
  template:
    metadata:
      labels:
        app: service-v1
    spec:
      nodeSelector:
        role: service
      containers:
      - name: app
        image: hashicorp/http-echo:latest
        args:
        - "-text=Service V1"
        - "-listen=:8080"
        ports:
        - containerPort: 8080
---
