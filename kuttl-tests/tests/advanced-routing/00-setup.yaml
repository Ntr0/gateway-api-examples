apiVersion: v1
kind: Namespace
metadata:
  name: advanced-routing-test
---
# GatewayClass is now created by Terraform
# See terraform/kubernetes.tf for the envoy-gateway-class definition
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: advanced-gateway
  namespace: advanced-routing-test
spec:
  gatewayClassName: envoy-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  - name: https
    protocol: HTTPS
    port: 443
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate
      certificateRefs:
      - name: example-tls-cert
