# Ingress-NGINX Basic Auth Example
# This is a reference example showing how to implement basic authentication
# using ingress-nginx (not part of any workflow)
#
# To generate htpasswd entries:
#   Option 1: Using htpasswd command (if available)
#     htpasswd -nb admin admin123
#     htpasswd -nb user user123
#
#   Option 2: Using openssl (for apr1/MD5 format)
#     echo -n "admin123" | openssl passwd -apr1 -stdin
#     echo -n "user123" | openssl passwd -apr1 -stdin
#     Then format as: username:$apr1$hash
#
#   Option 3: Using Python bcrypt
#     python3 -c "import bcrypt; print('admin:' + bcrypt.hashpw(b'admin123', bcrypt.gensalt()).decode())"
#
# Example credentials (replace with your own generated hashes):
#   Username: admin, Password: admin123
#   Username: user, Password: user123

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-demos

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: echo-service
  namespace: ingress-demos
spec:
  selector:
    app: echo-service
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-service
  namespace: ingress-demos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-service
  template:
    metadata:
      labels:
        app: echo-service
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo:latest
        args:
        - "-text=Hello from Ingress-NGINX - Echo Service!"
        - "-listen=:8080"
        ports:
        - containerPort: 8080

---
# Secret containing htpasswd file for basic authentication
# Format: username:encrypted_password
# To generate: htpasswd -c auth <username>
# Or manually: echo -n "password" | openssl passwd -apr1 -stdin
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth-secret
  namespace: ingress-demos
type: Opaque
stringData:
  auth: |
    admin:$apr1$rFqJY5xH$8K1pI0dDfGhJkLmN2oP3qR
    user:$apr1$sGqKZ6yI$9L2qJ1eEgHiKlMnO3pQ4sS
  # Note: Replace the example hashes above with real ones generated using one of the methods above.
  # The format should be: username:encrypted_password (one per line)

---
# Ingress with Basic Auth annotation
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: basic-auth-ingress
  namespace: ingress-demos
  annotations:
    # Enable basic authentication
    nginx.ingress.kubernetes.io/auth-type: basic
    # Reference the secret containing htpasswd file
    nginx.ingress.kubernetes.io/auth-secret: basic-auth-secret
    # Custom message shown in authentication prompt
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
spec:
  ingressClassName: nginx
  rules:
  - host: auth.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: echo-service
            port:
              number: 8080

