apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tls-route
  namespace: gateway-demos
spec:
  parentRefs:
  - name: tls-gateway
    namespace: gateway-demos
  hostnames:
  - "tls.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: echo-service
      port: 8080
      kind: Service

