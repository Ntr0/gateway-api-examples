# ClusterIssuer for cert-manager
# This creates a self-signed certificate issuer for demo purposes
# For production, use Let's Encrypt (see commented example below)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
