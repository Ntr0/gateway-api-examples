apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rate-limiting-route
  namespace: gateway-demos
spec:
  parentRefs:
  - name: rate-limiting-gateway
    namespace: gateway-demos
  hostnames:
  - "ratelimit.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: echo-service
      port: 8080
      kind: Service
---
# BackendTrafficPolicy for Envoy Gateway - Rate Limiting
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: rate-limit-policy
  namespace: gateway-demos
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: rate-limiting-route
  rateLimit:
    local:
      rules:
      - limit:
          requests: 5
          unit: Minute

