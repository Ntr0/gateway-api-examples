apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: basic-auth-route
  namespace: gateway-demos
spec:
  parentRefs:
  - name: basic-auth-gateway
    namespace: gateway-demos
  hostnames:
  - "auth.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: echo-service
      port: 8080
      kind: Service
---
# Basic Auth Policy for Envoy Gateway
# Note: The basic-auth-secret is created by setup.sh
# It contains htpasswd entries for admin:admin123 and user:user123
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: basic-auth-policy
  namespace: gateway-demos
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: basic-auth-route
  basicAuth:
    users:
      name: basic-auth-secret

